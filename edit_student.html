<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        input[readonly] {
            background: #eee;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;

            border: none;
            border-radius: 6px;

            background: #007bff;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;

            text-decoration: none;
            color: #007bff;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="box">

        <h1>
            Edit Student
        </h1>


        <form method="POST">


            <label>
                Name
            </label>

            <input
                type="text"
                name="name"
                value="{{ student.name }}"
                required
            >


            <label>
                Roll
            </label>

            <input
                type="text"
                value="{{ student.roll }}"
                readonly
            >


            <label>
                Department
            </label>

            <input
                type="text"
                name="department"
                value="{{ student.department }}"
                required
            >


            <button type="submit">
                Update Student
            </button>


        </form>


        <a href="/students" class="back">
            ← Back to Student List
        </a>

    </div>

</div>


</body>

</html>
