<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Student</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 30px auto;
        }

        .box {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .camera-area {
            margin-top: 25px;
            text-align: center;
        }


        video {
            width: 100%;
            max-width: 550px;
            max-height: 350px;
            border-radius: 10px;
            background-color: black;
            object-fit: cover;
        }

        canvas {
            display: none;
        }

        button {
            padding: 12px 22px;
            margin: 10px 5px;
            border: none;
            border-radius: 6px;
            color: white;
            background-color: #2563eb;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .capture-button {
            background-color: #16a34a;
        }

        .capture-button:hover {
            background-color: #15803d;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Register Student</h1>
    <p>Smart Attendance System</p>
</div>

<div class="container">

    <div class="box">

        <!-- Student Information -->

        <label for="name">Student Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter student name"
        >


        <label for="roll">Roll Number</label>

        <input
            type="text"
            id="roll"
            placeholder="Enter student roll"
        >


        <label for="department">Department</label>

        <input
            type="text"
            id="department"
            placeholder="Enter department"
        >


        <!-- Camera -->

        <div class="camera-area">

            <h2>Face Capture</h2>

            <video id="video" autoplay></video>

            <canvas id="canvas"></canvas>

            <br>

            <button onclick="startCamera()">
                Start Camera
            </button>

            <button
                class="capture-button"
                onclick="captureFace()"
            >
                Capture Face
            </button>

        </div>


        <!-- Message -->

        <div id="message" class="message"></div>


        <a href="/" class="back">
            ← Back to Dashboard
        </a>

    </div>

</div>


<script>

let video = document.getElementById("video");

let canvas = document.getElementById("canvas");

let stream = null;


// ==============================
// Start Camera
// ==============================

async function startCamera() {

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: true
        });

        video.srcObject = stream;

        showMessage(
            "Camera started. Look at the camera.",
            false
        );

    } catch (error) {

        showMessage(
            "Camera access denied or unavailable.",
            true
        );

        console.error(error);
    }
}


// ==============================
// Capture Face
// ==============================

function captureFace() {

    let name = document.getElementById("name").value.trim();

    let roll = document.getElementById("roll").value.trim();

    let department =
        document.getElementById("department").value.trim();


    // Check information

    if (!name || !roll || !department) {

        showMessage(
            "Please enter Name, Roll and Department first.",
            true
        );

        return;
    }


    // Check camera

    if (!stream) {

        showMessage(
            "Please start the camera first.",
            true
        );

        return;
    }


    // Canvas size

    canvas.width = video.videoWidth;

    canvas.height = video.videoHeight;


    // Capture current frame

    let context = canvas.getContext("2d");

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Convert image to Base64

    let imageData = canvas.toDataURL("image/jpeg");


    showMessage(
        "Capturing face and registering...",
        false
    );


    // Send to Flask

    fetch("/register_student", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            name: name,
            roll: roll,
            department: department,
            image: imageData

        })

    })

    .then(response => response.json())

    .then(data => {

        if (data.success) {

            showMessage(
                data.message,
                false
            );

            // Stop camera

            if (stream) {

                stream.getTracks().forEach(
                    track => track.stop()
                );

            }

        } else {

            showMessage(
                data.message,
                true
            );
        }

    })

    .catch(error => {

        console.error(error);

        showMessage(
            "Registration failed.",
            true
        );

    });

}


// ==============================
// Message
// ==============================

function showMessage(message, error) {

    let box = document.getElementById("message");

    box.style.display = "block";

    box.innerText = message;

    if (error) {

        box.style.backgroundColor = "#fee2e2";
        box.style.color = "#991b1b";

    } else {

        box.style.backgroundColor = "#dcfce7";
        box.style.color = "#166534";

    }

}

</script>

</body>

</html>
